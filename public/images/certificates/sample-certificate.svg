<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071a14" />
      <stop offset="50%" stop-color="#0a2920" />
      <stop offset="100%" stop-color="#040e0b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#f4b860" />
      <stop offset="100%" stop-color="#d49230" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9f99d" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(244, 184, 96, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad)" />
  <rect width="1200" height="850" fill="url(#gridPattern)" />

  <!-- Outer Border Frame -->
  <rect x="40" y="40" width="1120" height="770" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.85" />
  <rect x="52" y="52" width="1096" height="746" rx="12" fill="none" stroke="rgba(244, 184, 96, 0.3)" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Corner Ornaments -->
  <g fill="url(#goldGrad)">
    <!-- Top-Left -->
    <path d="M 52 82 L 82 82 L 82 52 L 78 52 L 78 78 L 52 78 Z" />
    <!-- Top-Right -->
    <path d="M 1148 82 L 1118 82 L 1118 52 L 1122 52 L 1122 78 L 1148 78 Z" />
    <!-- Bottom-Left -->
    <path d="M 52 768 L 82 768 L 82 798 L 78 798 L 78 772 L 52 772 Z" />
    <!-- Bottom-Right -->
    <path d="M 1148 768 L 1118 768 L 1118 798 L 1122 798 L 1122 772 L 1148 772 Z" />
  </g>

  <!-- Header / Institution -->
  <text x="600" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" letter-spacing="6" fill="#f4b860" font-weight="600">
    OFFICIAL ACADEMIC &amp; TECHNICAL CREDENTIAL
  </text>
  
  <text x="600" y="240" text-anchor="middle" font-family="'Cinzel Decorative', 'Cinzel', serif" font-size="44" letter-spacing="4" fill="url(#goldGrad)" font-weight="700">
    CERTIFICATE OF RECOGNITION
  </text>

  <!-- Subtitle -->
  <text x="600" y="300" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#9ca3af" font-style="italic">
    This credential is proudly and officially conferred upon
  </text>

  <!-- Recipient Name -->
  <text x="600" y="390" text-anchor="middle" font-family="'Cinzel Decorative', 'Cinzel', serif" font-size="52" letter-spacing="3" fill="url(#limeGrad)" font-weight="700">
    HUMNA NADEEM
  </text>

  <!-- Divider Line -->
  <line x1="380" y1="425" x2="820" y2="425" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Award Details -->
  <text x="600" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" fill="#f3f4f6" font-weight="600">
    Department First Position &amp; Academic Merit Award
  </text>
  <text x="600" y="515" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#9ca3af">
    In recognition of highest cumulative GPA (3.85 / 4.00) and sustained academic distinction.
  </text>

  <!-- Seal / Emblem -->
  <g transform="translate(600, 640)">
    <circle r="46" fill="rgba(244, 184, 96, 0.12)" stroke="url(#goldGrad)" stroke-width="2" />
    <circle r="38" fill="none" stroke="rgba(244, 184, 96, 0.4)" stroke-width="1" stroke-dasharray="4,3" />
    <!-- Ribbon Star Icon -->
    <path d="M0 -22 L6 -8 L21 -8 L9 2 L14 17 L0 8 L-14 17 L-9 2 L-21 -8 L-6 -8 Z" fill="url(#goldGrad)" />
    <text y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="2" fill="#f4b860">
      VERIFIED
    </text>
  </g>

  <!-- Signatures & Meta -->
  <g transform="translate(200, 670)">
    <line x1="0" y1="0" x2="240" y2="0" stroke="rgba(244, 184, 96, 0.4)" stroke-width="1" />
    <text x="120" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#e5e7eb" font-weight="500">
      Department of Software Engineering
    </text>
    <text x="120" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9ca3af">
      Authorized Issuer Signature
    </text>
  </g>

  <g transform="translate(760, 670)">
    <line x1="0" y1="0" x2="240" y2="0" stroke="rgba(244, 184, 96, 0.4)" stroke-width="1" />
    <text x="120" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#e5e7eb" font-weight="500">
      Credential ID: KUST-SE-RANK1-2024
    </text>
    <text x="120" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9ca3af">
      Date of Issuance: 2024
    </text>
  </g>
</svg>
